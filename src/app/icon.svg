<!--
  タブに出るアイコン。棚に本が3冊立っていて、1冊だけもたれている。

  **色はアプリの朱（--thread #e4572e）と同じにしてある。** 朱は経路と進捗の色で、
  画面の中で唯一の彩り（CLAUDE.md 8章 規則2）。アイコンだけ別の色にすると、
  タブと画面がつながらない。**青は使わない**——参考書の表紙は青が多く、
  画面から排除した色をわざわざ入口に戻すことになる。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- 地。透過にすると明暗どちらかのタブで消えるので必ず敷く -->
  <rect width="64" height="64" rx="14" fill="#e4572e"/>
  <!-- 本1 -->
  <rect x="13" y="21" width="12" height="27" rx="1.8" fill="#FBF7EE"/>
  <rect x="15.4" y="25" width="7.2" height="2.6" rx="1.3" fill="#e4572e" opacity=".5"/>
  <!-- 本2（目立たせる1冊） -->
  <rect x="27" y="16" width="9.5" height="32" rx="1.8" fill="#FFD95C"/>
  <rect x="28.9" y="20.5" width="5.7" height="2.6" rx="1.3" fill="#e4572e" opacity=".45"/>
  <!-- 本3。この14度の傾きが「本棚」を成立させている。削らないこと -->
  <g transform="rotate(14 49 48)">
    <rect x="38.5" y="23" width="10.5" height="25" rx="1.8" fill="#FBF7EE"/>
    <rect x="40.6" y="26.6" width="6.3" height="2.6" rx="1.3" fill="#e4572e" opacity=".5"/>
  </g>
  <!-- 棚板 -->
  <rect x="9" y="48" width="46" height="5.2" rx="2.6" fill="#FBF7EE"/>
</svg>