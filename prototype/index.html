<title>しおり 編集と共有のプロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #eceee8; --raised: #fbfbf8; --sunk: #f2f3ee; --deep: #e6e8e1;
    --ink: #1c2028; --ink-soft: #58616e; --ink-faint: #8b93a0;
    --rule: #dcdfd7; --rule-strong: #c2c7bc;
    --accent: #33518c; --accent-strong: #24406f; --accent-soft: #e2e8f4;
    --thread: #9c3f33; --thread-soft: #f4e4e0;
    --amber: #8c6115;
    --shadow-sm: 0 1px 2px rgba(28,32,40,0.05);
    --shadow: 0 1px 3px rgba(28,32,40,0.07), 0 10px 24px rgba(28,32,40,0.09);
    --shadow-lift: 0 14px 26px rgba(28,32,40,0.20), 0 3px 8px rgba(28,32,40,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14161b; --raised: #1d2027; --sunk: #22262e; --deep: #171a20;
      --ink: #e8e9e4; --ink-soft: #a5acb7; --ink-faint: #6d7581;
      --rule: #2c3039; --rule-strong: #3b414c;
      --accent: #8fabdd; --accent-strong: #b4c6e9; --accent-soft: #1d2839;
      --thread: #c9584a; --thread-soft: #33211e;
      --amber: #d9a055;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow: 0 1px 3px rgba(0,0,0,0.45), 0 10px 24px rgba(0,0,0,0.5);
      --shadow-lift: 0 16px 28px rgba(0,0,0,0.62), 0 3px 8px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14161b; --raised: #1d2027; --sunk: #22262e; --deep: #171a20;
    --ink: #e8e9e4; --ink-soft: #a5acb7; --ink-faint: #6d7581;
    --rule: #2c3039; --rule-strong: #3b414c;
    --accent: #8fabdd; --accent-strong: #b4c6e9; --accent-soft: #1d2839;
    --thread: #c9584a; --thread-soft: #33211e;
    --amber: #d9a055;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow: 0 1px 3px rgba(0,0,0,0.45), 0 10px 24px rgba(0,0,0,0.5);
    --shadow-lift: 0 16px 28px rgba(0,0,0,0.62), 0 3px 8px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .device, .controls { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.001ms !important; } }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; }

  .page { max-width: 520px; margin: 0 auto; padding: clamp(1rem, 4vw, 2rem) clamp(0.85rem, 4vw, 1.25rem) 4rem; }

  /* ---- 操作卓 ---- */
  .controls {
    display: flex; gap: 0.75rem 0.9rem; align-items: center; flex-wrap: wrap;
    background: var(--raised); border: 1px solid var(--rule); border-radius: 12px;
    padding: 0.8rem 1rem; box-shadow: var(--shadow-sm); margin-bottom: 1.1rem;
  }
  .seg { display: flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { background: transparent; border: 0; padding: 0.4rem 0.8rem; font-size: 0.81rem; color: var(--ink-soft); transition: background .15s, color .15s; }
  .seg button + button { border-left: 1px solid var(--rule-strong); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 500; }
  .seg button:not(.on):hover { background: var(--sunk); }
  .hint { margin: 0; flex: 1; min-width: 13rem; font-size: 0.8rem; color: var(--ink-soft); }
  .reset { flex: none; background: transparent; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 0.4rem 0.7rem; font-size: 0.76rem; color: var(--ink-soft); }
  .reset:hover { background: var(--sunk); }
  .seg button:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- 端末 ---- */
  .device { background: var(--raised); border: 1px solid var(--rule); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .app { display: flex; flex-direction: column; min-height: 32rem; }
  .shared-app { background: var(--raised); }

  .topbar { display: flex; align-items: center; gap: 0.45rem; padding: 0.75rem 1rem 0.7rem; border-bottom: 1px solid var(--rule); }
  .spacer { flex: 1; }
  .tb-btn {
    display: inline-flex; align-items: center; gap: 0.32rem; flex: none;
    background: transparent; border: 1px solid var(--rule-strong); border-radius: 100px;
    padding: 0.26rem 0.75rem; font-size: 0.75rem; color: var(--ink-soft);
  }
  .tb-btn:hover { background: var(--sunk); color: var(--ink); border-color: var(--ink-faint); }
  .tb-btn svg { fill: none; }
  .tb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shared-brand { font-family: "Shippori Mincho", serif; font-weight: 600; font-size: 0.98rem; letter-spacing: 0.12em; color: var(--ink-soft); }
  .ro-tag { font-size: 0.7rem; color: var(--ink-faint); border: 1px solid var(--rule); border-radius: 100px; padding: 0.14em 0.6em 0.2em; }

  .route-head { padding: 1.15rem 1rem 0.35rem; }
  .route-title { font-family: "Shippori Mincho", serif; font-weight: 600; font-size: 1.36rem; margin: 0 0 0.6rem; line-height: 1.42; text-wrap: balance; }
  .head-row { display: flex; align-items: center; gap: 0.6rem; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 0.32rem; flex: 1; min-width: 0; }
  .tag { font-size: 0.72rem; padding: 0.12em 0.6em 0.18em; border-radius: 100px; background: var(--accent-soft); color: var(--accent-strong); border: 1px solid transparent; }
  .tag.add { background: transparent; border: 1px dashed var(--rule-strong); color: var(--ink-faint); }
  .tag.add:hover { color: var(--ink-soft); border-color: var(--ink-faint); }
  .prog { font-family: "JetBrains Mono", monospace; font-size: 0.66rem; color: var(--ink-faint); flex: none; }

  /* ---- 経路 ---- */
  .route { padding: 0.95rem 1rem 1.5rem; }
  .cap { font-family: "JetBrains Mono", monospace; font-size: 0.6rem; letter-spacing: 0.16em; color: var(--ink-faint); }
  .start { display: flex; align-items: center; gap: 0.7rem; padding-left: 0.15rem; }
  .start-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--rule-strong), transparent); }

  .stop { display: flex; align-items: stretch; gap: 0.75rem; }
  .rail { position: relative; flex: none; width: 22px; display: flex; justify-content: center; }
  .thread { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--thread); opacity: 0.34; transition: opacity .2s; }
  .stop.is-done .thread { opacity: 1; }
  .stop.shared .thread { opacity: 0.7; }

  .bead {
    position: relative; margin-top: 1.25rem; width: 22px; height: 22px; border-radius: 50%;
    background: var(--raised); color: var(--thread); display: grid; place-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 0.67rem; padding: 0;
    border: 2px solid var(--thread); box-shadow: 0 0 0 3px var(--raised);
    transition: background .16s, color .16s;
  }
  .bead:hover { background: var(--thread-soft); }
  .bead:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .stop.is-done .bead { background: var(--thread); color: #fff; }
  .bead.ghost { background: var(--raised); color: var(--ink-faint); border: 1.5px dashed var(--rule-strong); }
  .bead.static { cursor: default; }

  /* カードは枠線を持たず、紐と玉に構造を任せる */
  .card {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.75rem;
    background: var(--sunk); border-radius: 10px; padding: 0.6rem 0 0.6rem 0.7rem;
    margin: 0.5rem 0; text-align: left; cursor: grab; border: 1px solid transparent;
    touch-action: pan-y; transition: background .16s, border-color .16s;
  }
  .card:hover { border-color: var(--rule-strong); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card:active { cursor: grabbing; }
  .stop.overlay .card { box-shadow: var(--shadow-lift); background: var(--raised); border-color: var(--thread); cursor: grabbing; }
  .stop.overlay { padding-left: 2.55rem; }
  .stop.is-done .card { background: transparent; border-color: var(--rule); }
  .stop.is-done .t { color: var(--ink-soft); }
  .stop.is-done .cover { opacity: 0.5; }

  .meta { flex: 1; min-width: 0; }
  .t { font-size: 0.89rem; line-height: 1.45; font-weight: 500; }
  .sub { display: flex; align-items: center; flex-wrap: wrap; gap: 0.32rem; margin-top: 0.05rem; }
  .au { font-size: 0.71rem; color: var(--ink-faint); }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 0.63rem; line-height: 1.7; color: var(--ink-soft); }
  .chip::before { content: "·"; margin-right: 0.34em; color: var(--ink-faint); }
  .chip.memo { color: var(--amber); }

  .cover { border-radius: 2px 4px 4px 2px; flex: none; box-shadow: var(--shadow-sm); }
  .cover.md { width: 38px; height: 52px; }
  .cover.sm { width: 28px; height: 38px; }

  .handle {
    flex: none; align-self: stretch; display: grid; place-items: center;
    width: 50px; margin: -0.6rem 0; border-radius: 0 10px 10px 0;
    color: var(--rule-strong); cursor: grab; touch-action: none;
  }
  .handle:hover { color: var(--thread); background: var(--thread-soft); }
  .handle:active { color: var(--thread); background: var(--thread-soft); }
  .handle svg { fill: currentColor; pointer-events: none; }

  .blank { padding: 1.6rem 0 1.6rem 2.55rem; color: var(--ink-faint); font-size: 0.86rem; }

  .add-stop { display: flex; align-items: stretch; gap: 0.75rem; width: 100%; background: transparent; border: 0; padding: 0; text-align: left; }
  .add-stop .thread { opacity: 0.28; }
  .add-label { flex: 1; margin: 0.5rem 0; padding: 0.72rem 0.9rem; border-radius: 10px; border: 1.5px dashed var(--rule-strong); color: var(--ink-soft); font-size: 0.86rem; }
  .add-stop:hover .add-label { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .add-stop:hover .bead.ghost { border-color: var(--accent); color: var(--accent); }
  .add-stop:focus-visible .add-label { outline: 2px solid var(--accent); outline-offset: 2px; }

  .goal { display: flex; align-items: flex-start; gap: 0.75rem; }
  .goal .rail { min-height: 30px; }
  .goal .thread { top: 0; bottom: auto; height: 0.6rem; opacity: 0.34; }
  .goal .flag {
    position: relative; margin-top: 0.6rem; flex: none; width: 22px; height: 22px;
    display: grid; place-items: center; border-radius: 50%;
    background: var(--thread); color: #fff; box-shadow: 0 0 0 3px var(--raised);
  }
  .goal-cap { padding-top: 1rem; }

  /* ---- 共有ページの1冊 ---- */
  .scard { flex: 1; min-width: 0; background: var(--sunk); border-radius: 10px; padding: 0.7rem 0.85rem; margin: 0.5rem 0; }
  .shead { display: flex; align-items: center; gap: 0.75rem; }
  .snote {
    margin: 0.6rem 0 0; padding-top: 0.55rem; border-top: 1px solid var(--rule);
    font-size: 0.82rem; line-height: 1.75; color: var(--ink-soft);
  }

  .byline { display: flex; align-items: center; gap: 0.45rem; margin: -0.2rem 0 0.6rem; font-size: 0.78rem; color: var(--ink-soft); }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent-strong); font-size: 0.72rem; font-weight: 700;
  }

  .cta { margin: 0 1rem 1.4rem; padding: 1.25rem 1.1rem; border-radius: 14px; background: var(--deep); text-align: center; }
  .cta-t { margin: 0 0 0.9rem; font-size: 0.87rem; color: var(--ink-soft); line-height: 1.75; }
  .cta-note { color: var(--ink-faint); font-size: 0.79rem; }
  .cta-b { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.95rem; font-weight: 500; }
  .cta-b:hover { background: var(--accent-strong); }
  .cta-b:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cta-alt { display: block; width: 100%; margin-top: 0.5rem; background: transparent; border: 0; padding: 0.5rem; font-size: 0.82rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
  .cta-alt:hover { color: var(--ink); }
  .cta-alt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .cta-s { margin: 0.55rem 0 0; font-size: 0.73rem; color: var(--ink-faint); }

  /* 複製元の表示 */
  .origin {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    margin: -0.15rem 0 0.6rem; padding: 0.4rem 0.65rem;
    background: var(--thread-soft); border-radius: 8px;
    font-size: 0.76rem; color: var(--ink-soft);
  }
  .origin-link { background: transparent; border: 0; padding: 0; margin-left: auto; font-size: 0.76rem; color: var(--thread); text-decoration: underline; text-underline-offset: 2px; }
  .origin-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* 通知 */
  .toast {
    position: fixed; left: 50%; bottom: 1.2rem; z-index: 200;
    transform: translate(-50%, 1.5rem); opacity: 0; pointer-events: none;
    max-width: min(460px, calc(100% - 2rem));
    background: var(--ink); color: var(--paper); border-radius: 10px;
    padding: 0.65rem 1rem; font-size: 0.83rem; line-height: 1.6;
    box-shadow: var(--shadow-lift); transition: opacity .22s, transform .22s cubic-bezier(0.2,0,0,1);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---- シート ---- */
  .field-row { display: flex; align-items: center; gap: 0.5rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 10px; padding: 0.55rem 0.7rem; }
  .field-row:focus-within { border-color: var(--accent); }
  .field-row .mag { color: var(--ink-faint); flex: none; }
  .field-row input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 0.92rem; outline: none; }
  .field-row input::placeholder { color: var(--ink-faint); }

  .res { display: flex; align-items: center; gap: 0.65rem; width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 0.6rem 0.75rem; text-align: left; }
  .res:last-child { border-bottom: 0; }
  .res:hover:not(:disabled) { background: var(--sunk); }
  .res:disabled { opacity: 0.5; cursor: default; }
  .res .t { font-size: 0.86rem; }
  .res .a { font-size: 0.71rem; color: var(--ink-faint); }
  .res .plus { flex: none; font-size: 0.71rem; color: var(--accent-strong); background: var(--accent-soft); border-radius: 100px; padding: 0.16em 0.6em 0.2em; }
  .res.has .plus { color: var(--ink-faint); background: var(--sunk); }
  .empty { padding: 1.6rem 1rem; text-align: center; font-size: 0.86rem; color: var(--ink-faint); display: flex; flex-direction: column; gap: 0.2rem; }
  .empty span { font-size: 0.76rem; }

  .sheet-wrap { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
  .sheet-wrap.on { pointer-events: auto; }
  .scrim { position: absolute; inset: 0; background: rgba(14,16,20,0.44); opacity: 0; transition: opacity .24s ease; }
  .sheet-wrap.on .scrim { opacity: 1; }
  .sheet {
    position: absolute; left: 50%; bottom: 0; width: min(520px, 100%);
    transform: translate(-50%, 100%); transition: transform .28s cubic-bezier(0.2,0,0,1);
    background: var(--raised); border-top-left-radius: 18px; border-top-right-radius: 18px;
    border-top: 1px solid var(--rule); box-shadow: var(--shadow-lift);
    display: flex; flex-direction: column; max-height: 82vh; padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-wrap.on .sheet { transform: translate(-50%, 0); }
  .grip { width: 34px; height: 4px; border-radius: 100px; background: var(--rule-strong); margin: 0.6rem auto 0.2rem; flex: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem 0.6rem; font-weight: 500; font-size: 0.92rem; }
  .close { background: transparent; border: 0; font-size: 0.8rem; color: var(--ink-soft); padding: 0.2rem 0.3rem; }
  .close:hover { color: var(--ink); }
  .sheet .field-row { margin: 0 1rem; }
  .sheet-body { overflow-y: auto; }
  .sheet-body.list { padding: 0.5rem 0.5rem 1rem; margin-top: 0.4rem; }
  .sheet-body.detail { padding: 0.4rem 1rem 1.2rem; display: flex; flex-direction: column; gap: 1.05rem; }
  .sheet-body.share { padding: 0.3rem 1rem 1.3rem; display: flex; flex-direction: column; gap: 1rem; }

  .dhead { display: flex; align-items: center; gap: 0.75rem; }
  .dt { font-size: 0.95rem; font-weight: 500; line-height: 1.45; }
  .da { font-size: 0.74rem; color: var(--ink-faint); }

  .done-btn { display: flex; align-items: center; gap: 0.55rem; width: 100%; background: var(--sunk); border: 1px solid var(--rule); border-radius: 10px; padding: 0.65rem 0.85rem; font-size: 0.88rem; color: var(--ink-soft); }
  .done-btn .tick { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 2px solid var(--rule-strong); color: #fff; }
  .done-btn.on { background: var(--thread-soft); border-color: color-mix(in srgb, var(--thread) 45%, transparent); color: var(--thread); font-weight: 500; }
  .done-btn.on .tick { background: var(--thread); border-color: var(--thread); }
  .done-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fld { display: flex; flex-direction: column; gap: 0.45rem; }
  .lb { font-size: 0.78rem; color: var(--ink-soft); font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 0.5rem; }
  .stepper button { width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--sunk); border: 1px solid var(--rule); color: var(--ink-soft); font-size: 1rem; line-height: 1; }
  .stepper button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
  .stepper button:disabled { opacity: 0.4; cursor: default; }
  .stepper .val { font-family: "JetBrains Mono", monospace; font-size: 0.86rem; min-width: 4.5em; text-align: center; }
  .stepper .clear { width: auto; padding: 0 0.6rem; font-size: 0.72rem; margin-left: auto; }
  .note-h { margin: 0; font-size: 0.72rem; color: var(--ink-faint); }
  .fld textarea { font-size: 0.88rem; line-height: 1.7; resize: vertical; background: var(--sunk); border: 1px solid var(--rule); border-radius: 10px; padding: 0.6rem 0.75rem; color: var(--ink); outline: none; width: 100%; }
  .fld textarea:focus { border-color: var(--accent); }
  .fld textarea::placeholder { color: var(--ink-faint); }

  .dfoot { display: flex; align-items: center; gap: 0.6rem; }
  .dfoot .danger { background: transparent; border: 1px solid var(--rule-strong); border-radius: 9px; padding: 0.55rem 0.8rem; font-size: 0.82rem; color: var(--ink-soft); }
  .dfoot .danger:hover { border-color: var(--thread); color: var(--thread); }
  .dfoot .primary { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 0.58rem 1.1rem; font-size: 0.86rem; font-weight: 500; }
  .dfoot .primary:hover { background: var(--accent-strong); }
  .dfoot button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- 共有シート ---- */
  .toggle-row { display: flex; align-items: flex-start; gap: 0.7rem; width: 100%; text-align: left; background: var(--sunk); border: 1px solid var(--rule); border-radius: 11px; padding: 0.75rem 0.85rem; }
  .toggle-row.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .tg { flex: none; width: 38px; height: 22px; border-radius: 100px; background: var(--rule-strong); position: relative; margin-top: 0.15rem; transition: background .18s; }
  .toggle-row.on .tg { background: var(--accent); }
  .knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .18s cubic-bezier(0.2,0,0,1); }
  .toggle-row.on .knob { transform: translateX(16px); }
  .tg-txt { display: flex; flex-direction: column; gap: 0.1rem; }
  .tg-t { font-size: 0.86rem; font-weight: 500; }
  .tg-d { font-size: 0.74rem; color: var(--ink-faint); line-height: 1.6; }
  .toggle-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .share-body { display: flex; flex-direction: column; gap: 1rem; transition: opacity .2s; }
  .share-body.off { opacity: 0.4; pointer-events: none; }
  .url-row { display: flex; gap: 0.5rem; }
